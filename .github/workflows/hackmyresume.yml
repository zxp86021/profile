name: hackmyresume

on:
  push:
    branches: 
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMMIT_SECRET: ${{secrets.GH_PAGE_TOKEN}}
      USER_NAME: GithubActions
      USER_EMAIL: githubactions@github.com
      PUBLISH_DIR: ./dist
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 1
      
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 14.x

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Run build
      run: |
        npm ci
        npm run build --if-present
      env:
        CI: true
        THEME: jsonresume-theme-paper
        OUTPUT_PATH: dist/resume.all

    - name: Add additional files to PUBLISH_DIR
      run: |
        echo -e "User-agent: *\nContent-Signal: ai-train=no, search=yes, ai-input=yes\nAllow: /" > $PUBLISH_DIR/robots.txt
        cp $PUBLISH_DIR/resume.html $PUBLISH_DIR/index.html

    - name: Upload compiled files
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist

  deploy:
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
